name: Build Multiplatform Releases (Windows, macOS, Android Studio, iOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-checks:
    name: QA Tests (Front-end + Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Run Frontend Tests & Production Build
        run: |
          npm test
          npm run build

      - name: Run Rust Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows (.msi / .exe)
    needs: qa-checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Windows Installers
        run: npx tauri build --bundles msi,nsis

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logickiosk-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    name: Build macOS Universal (.dmg / .app)
    needs: qa-checks
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri macOS Universal Bundle
        run: npx tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Package .app archive
        run: |
          mkdir -p dist-macos
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-macos/
          tar -czf dist-macos/LogicKiosk-macos-universal.app.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos LogicKiosk.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logickiosk-macos
          path: dist-macos/*

  build-android:
    name: Build Android Studio Project, APK & AAB
    needs: qa-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK 27
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -1d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager nao encontrado em $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Android Studio Project
        run: npx tauri android init --ci

      - name: Build Android APK & AAB
        run: npx tauri android build --apk --aab --target aarch64 --target armv7 --target x86_64 --ci

      - name: Package Android Studio Project & Binaries
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-android/ \;
          tar --exclude='src-tauri/gen/android/app/build' --exclude='src-tauri/gen/android/.gradle' -czf dist-android/LogicKiosk-android-studio-project.tar.gz -C src-tauri/gen android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logickiosk-android
          path: dist-android/*

  build-ios:
    name: Build iOS Xcode Project & Archive (.app / .ipa)
    needs: qa-checks
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build

      - name: Initialize iOS Xcode Project
        run: npx tauri ios init --ci

      - name: Build iOS IPA (signed) or Unsigned App Archive (fallback)
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p dist-ios
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ] && [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            security create-keychain -p "temp-pass" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "temp-pass" "$KEYCHAIN_PATH"
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            npx tauri ios build --export-method release-testing --ci
            find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} dist-ios/ \;
          else
            echo "Building unsigned iOS archive via Tauri CLI (--archive-only --no-sign)..."
            npx tauri ios build --ci --archive-only --no-sign
            if [ -d src-tauri/gen/apple/build ]; then
              tar -czf dist-ios/LogicKiosk-ios-unsigned-archive.tar.gz -C src-tauri/gen/apple build
            fi
          fi

      - name: Package iOS Xcode Project
        run: |
          mkdir -p dist-ios
          tar --exclude='src-tauri/gen/apple/build' -czf dist-ios/LogicKiosk-ios-xcode-project.tar.gz -C src-tauri/gen apple

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logickiosk-ios
          path: dist-ios/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
