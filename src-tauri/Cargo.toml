[package]
name = "logickiosk"
version = "0.1.1"
license = "MIT"
description = "LogicKiosk — Plataforma Gamificada de Ensino de Lógica e Algoritmos"
authors = ["LogicKiosk Team"]
edition = "2021"

[lib]
name = "logickiosk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios", target_os = "linux")))'.dependencies]
keyring = "3.6"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
